components:
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      description: Agent ID
      schema:
        type: string
    SessionId:
      name: id
      in: path
      required: true
      description: Session ID
      schema:
        type: string
    MemoryId:
      name: id
      in: path
      required: true
      description: Memory ID
      schema:
        type: string
    FlowName:
      name: name
      in: path
      required: true
      description: Flow name
      schema:
        type: string
    RunId:
      name: id
      in: path
      required: true
      description: Run ID
      schema:
        type: string
    TriggerId:
      name: id
      in: path
      required: true
      description: Trigger ID
      schema:
        type: string
    TeamId:
      name: id
      in: path
      required: true
      description: Team ID
      schema:
        type: string
    ScheduleId:
      name: id
      in: path
      required: true
      description: Schedule ID
      schema:
        type: string
    CredentialId:
      name: id
      in: path
      required: true
      description: Credential ID
      schema:
        type: string
    WorkspaceId:
      name: id
      in: path
      required: true
      description: Workspace name (ID)
      schema:
        type: string
    SkillName:
      name: name
      in: path
      required: true
      description: Skill name
      schema:
        type: string
    KBName:
      name: name
      in: path
      required: true
      description: Knowledge base name
      schema:
        type: string
    MCPToolName:
      name: name
      in: path
      required: true
      description: MCP tool name
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ─── Common ───────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required: [error]

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "deleted"

    # ─── System ───────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        uptime_s:
          type: integer
          description: Server uptime in seconds
        go_version:
          type: string
          description: Go runtime version
        timestamp:
          type: string
          format: date-time
          description: Current UTC timestamp

    # ─── Agents ───────────────────────────────────────────────────────
    AgentConfig:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Agent name
        model:
          type: string
          description: Model identifier
        system_prompt:
          type: string
          description: System prompt for the agent
        memory_strategy:
          type: string
          description: Memory strategy (token_buffer, summary, or empty)
          enum: [token_buffer, summary, ""]

    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            type: object
            description: Agent object
        count:
          type: integer

    AgentCreateResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    AgentGetResponse:
      type: object
      properties:
        id:
          type: string
        agent:
          type: object
          description: Agent object

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message
        preempt_mode:
          type: string
          description: Preempt mode for input queue
          enum: [queue, safe_point, force]

    ChatResponse:
      type: object
      properties:
        response:
          type: string
        agent_id:
          type: string

    AgentStatusResponse:
      type: object
      properties:
        agent_id:
          type: string
        turn_phase:
          type: string
          description: Current TurnLoop phase
        cancel_pending:
          type: boolean

    # ─── Sessions ─────────────────────────────────────────────────────
    CreateSessionRequest:
      type: object
      required: [agent_id]
      properties:
        owner:
          type: string
          description: Session owner
        agent_id:
          type: string
          description: Agent ID to bind

    SessionRecord:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        agent_id:
          type: string
        status:
          type: string
          enum: [active, stopped, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeleteSessionResponse:
      type: object
      properties:
        status:
          type: string
          example: "deleted"
        id:
          type: string

    # ─── Tools ────────────────────────────────────────────────────────
    ToolListResponse:
      type: object
      properties:
        tools:
          type: array
          items:
            type: object
        count:
          type: integer

    # ─── Memories ─────────────────────────────────────────────────────
    CreateMemoryRequest:
      type: object
      properties:
        id:
          type: string
