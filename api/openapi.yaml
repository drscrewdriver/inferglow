openapi: "3.0.3"
info:
  title: "InferGlow API"
  description: "InferGlow Agent Framework REST API"
  version: "6.0.0"
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  # ─── Health & Dashboard ───────────────────────────────────────────────
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [System]
      responses:
        "200":
          description: Server health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /dashboard:
    get:
      operationId: getDashboard
      summary: Observability dashboard (HTML)
      tags: [System]
      responses:
        "200":
          description: Dashboard HTML page
          content:
            text/html:
              schema:
                type: string

  # ─── Agents ───────────────────────────────────────────────────────────
  /v1/agents:
    get:
      operationId: listAgents
      summary: List all agents
      tags: [Agents]
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
    post:
      operationId: createAgent
      summary: Create a new agent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfig"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agents/{id}:
    get:
      operationId: getAgent
      summary: Get an agent by ID
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentGetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{id}/chat:
    post:
      operationId: chatWithAgent
      summary: Synchronous chat with an agent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many requests (queue full)
          headers:
            Retry-After:
              schema:
                type: integer

  /v1/agents/{id}/input:
    post:
      operationId: agentInput
      summary: Submit input to agent with preempt mode
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Input queue is full
          headers:
            Retry-After:
              schema:
                type: integer
        "503":
          description: Agent does not support input queue

  /v1/agents/{id}/stream:
    post:
      operationId: streamChatWithAgent
      summary: Stream chat with agent (SSE)
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEStream"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{id}/stream-run:
    post:
      operationId: streamRunAgent
      summary: Streaming agent execution with tool call events (SSE)
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE event stream with tool/LLM lifecycle events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ToolStreamEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{id}/status:
    get:
      operationId: getAgentStatus
      summary: Get agent runtime status (TurnLoop phase)
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Sessions ─────────────────────────────────────────────────────────
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a new management session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listSessions
      summary: List all sessions
      tags: [Sessions]
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionRecord"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/sessions/{id}:
    get:
      operationId: getSession
      summary: Get a session by ID
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSession
      summary: Delete a session
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/sessions/{id}/stream:
    get:
      operationId: streamSession
      summary: Stream session events via SSE
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ─── Tools ────────────────────────────────────────────────────────────
  /v1/tools:
    get:
      operationId: listTools
      summary: List available tools
      tags: [Tools]
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolListResponse"

  # ─── Memories ─────────────────────────────────────────────────────────
  /v1/memories:
    post:
      operationId: createMemory
      summary: Create a memory entry
      tags: [Memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: searchMemories
      summary: Search memories
      tags: [Memories]
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum results
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Memory search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySearchResponse"

  /v1/memories/{id}:
    get:
      operationId: getMemory
      summary: Get a memory by ID
      tags: [Memories]
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Memory record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteMemory
      summary: Delete a memory by ID
      tags: [Memories]
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Memory deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeleteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/memories/search:
    post:
      operationId: semanticMemorySearch
      summary: Semantic search for memories
      tags: [Memories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticMemorySearchRequest"
      responses:
        "200":
          description: Semantic search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySearchResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/memories/stats:
    get:
      operationId: getMemoryStats
      summary: Get memory subsystem statistics
      tags: [Memories]
      responses:
        "200":
          description: Memory statistics
          content:
            application/json:
              schema:
                type: object
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ─── Flows ────────────────────────────────────────────────────────────
  /v1/flows:
    get:
      operationId: listFlows
      summary: List all registered flows
      tags: [Flows]
      responses:
        "200":
          description: Flow names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: registerFlow
      summary: Register a new flow (hot-load YAML)
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
              description: YAML flow definition
      responses:
        "201":
          description: Flow registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Unprocessable flow definition

  /v1/flows/{name}:
    get:
      operationId: getFlow
      summary: Get a flow definition by name
      tags: [Flows]
      parameters:
        - $ref: "#/components/parameters/FlowName"
      responses:
        "200":
          description: Flow definition
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/flows/{name}/validate:
    post:
      operationId: validateFlow
      summary: Validate a flow definition without loading
      tags: [Flows]
      parameters:
        - $ref: "#/components/parameters/FlowName"
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: string
              description: YAML flow definition to validate
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Invalid flow definition

  # ─── Stages ───────────────────────────────────────────────────────────
  /v1/stages:
    get:
      operationId: listStages
      summary: List available stages
      tags: [Stages]
      responses:
        "200":
          description: Stage names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ─── Runs ─────────────────────────────────────────────────────────────
  /v1/runs:
    post:
      operationId: createRun
      summary: Create and start a flow run
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listRuns
      summary: List all runs
      tags: [Runs]
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, running, paused, done, failed, canceled]
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunResponse"

  /v1/runs/{id}:
    get:
      operationId: getRun
      summary: Get run status by ID
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: cancelRun
      summary: Cancel a run
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        "409":
          description: Conflict (cannot cancel)

  /v1/runs/{id}/pause:
    post:
      operationId: pauseRun
      summary: Pause a running run
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        "409":
          description: Conflict (cannot pause)

  /v1/runs/{id}/resume:
    post:
      operationId: resumeRun
      summary: Resume a paused run
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRunRequest"
      responses:
        "200":
          description: Run resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        "409":
          description: Conflict (cannot resume)

  /v1/runs/{id}/events:
    get:
      operationId: getRunEvents
      summary: Stream run events via SSE
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/runs/{id}/state:
    get:
      operationId: getRunState
      summary: Get run execution state snapshot
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/runs/{id}/steps:
    get:
      operationId: getRunSteps
      summary: Get run step execution log
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run step log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStepsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Triggers ─────────────────────────────────────────────────────────
  /v1/triggers:
    post:
      operationId: createTrigger
      summary: Register a new trigger
      tags: [Triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerConfig"
      responses:
        "201":
          description: Trigger created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Trigger already exists
    get:
      operationId: listTriggers
      summary: List all triggers
      tags: [Triggers]
      responses:
        "200":
          description: Trigger list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TriggerResponse"

  /v1/triggers/{id}:
    get:
      operationId: getTrigger
      summary: Get a trigger by ID
      tags: [Triggers]
      parameters:
        - $ref: "#/components/parameters/TriggerId"
      responses:
        "200":
          description: Trigger details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTrigger
      summary: Remove a trigger
      tags: [Triggers]
      parameters:
        - $ref: "#/components/parameters/TriggerId"
      responses:
        "200":
          description: Trigger deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/triggers/{id}/start:
    post:
      operationId: startTrigger
      summary: Activate a trigger
      tags: [Triggers]
      parameters:
        - $ref: "#/components/parameters/TriggerId"
      responses:
        "200":
          description: Trigger started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/triggers/{id}/stop:
    post:
      operationId: stopTrigger
      summary: Deactivate a trigger
      tags: [Triggers]
      parameters:
        - $ref: "#/components/parameters/TriggerId"
      responses:
        "200":
          description: Trigger stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerActionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/webhooks/{id}:
    post:
      operationId: webhookEntry
      summary: Webhook HTTP entry point
      tags: [Triggers]
      parameters:
        - $ref: "#/components/parameters/TriggerId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Not a webhook trigger
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Teams ────────────────────────────────────────────────────────────
  /v1/teams:
    post:
      operationId: createTeam
      summary: Create a team definition
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamConfig"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listTeams
      summary: List all team definitions
      tags: [Teams]
      responses:
        "200":
          description: Team list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/teams/{id}:
    get:
      operationId: getTeam
      summary: Get a team definition by ID
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteTeam
      summary: Delete a team definition
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/teams/{id}/run:
    post:
      operationId: teamRun
      summary: Execute a team coordination round synchronously
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRunRequest"
      responses:
        "200":
          description: Team execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/teams/{id}/stream:
    post:
      operationId: teamStream
      summary: Execute a team coordination round with SSE streaming
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamRunRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ─── Context ──────────────────────────────────────────────────────────
  /v1/context/search:
    get:
      operationId: contextSearch
      summary: Semantic or keyword search via ContextProvider
      tags: [Context]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum results
          schema:
            type: integer
            default: 10
        - name: scope
          in: query
          description: Search scope
          schema:
            type: string
            enum: [session, task_group, global]
            default: global
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/context/stats:
    get:
      operationId: contextStats
      summary: Get context subsystem statistics
      tags: [Context]
      responses:
        "200":
          description: Context statistics
          content:
            application/json:
              schema:
                type: object
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

