name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go test (root module)
        run: go test ./...

      - name: Run go test (submodules)
        run: find . -mindepth 2 -name go.mod -execdir go test ./... \;

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go vet (root module)
        run: go vet ./...

      - name: Run go vet (submodules)
        run: find . -mindepth 2 -name go.mod -execdir go vet ./... \;

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint (root module)
        run: golangci-lint run ./...

      - name: Run golangci-lint (submodules)
        run: find . -mindepth 2 -name go.mod -execdir golangci-lint run ./... \;
