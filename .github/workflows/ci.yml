name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.tags == '' && '(default)' || matrix.tags }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: ["", "with_sandbox"]
    env:
      GO_TAGS: ${{ matrix.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go test (root module)
        run: |
          if [ -n "$GO_TAGS" ]; then
            go test -tags "$GO_TAGS" ./...
          else
            go test ./...
          fi

      - name: Run go test (submodules)
        run: |
          TAGS=""
          if [ -n "$GO_TAGS" ]; then
            TAGS="-tags $GO_TAGS"
          fi
          find . -mindepth 2 -name go.mod -execdir go test $TAGS ./... \;

      - name: Dependency audit
        run: |
          go mod verify
          find . -mindepth 2 -name go.mod -execdir go mod verify \;

  vet:
    name: Vet ${{ matrix.tags == '' && '(default)' || matrix.tags }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: ["", "with_sandbox"]
    env:
      GO_TAGS: ${{ matrix.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go vet (root module)
        run: |
          if [ -n "$GO_TAGS" ]; then
            go vet -tags "$GO_TAGS" ./...
          else
            go vet ./...
          fi

      - name: Run go vet (submodules)
        run: |
          TAGS=""
          if [ -n "$GO_TAGS" ]; then
            TAGS="-tags $GO_TAGS"
          fi
          find . -mindepth 2 -name go.mod -execdir go vet $TAGS ./... \;

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint (root module)
        run: |
          if ls *.go 2>/dev/null; then
            golangci-lint run ./...
          else
            echo "No Go files in root module, skipping"
          fi

      - name: Run golangci-lint (submodules)
        run: find . -mindepth 2 -name go.mod -execdir sh -c 'test -n "$(ls *.go 2>/dev/null)" && golangci-lint run ./... || echo "No Go files in $(pwd), skipping"' \;
